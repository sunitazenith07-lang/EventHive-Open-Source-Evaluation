name: OrderOps pull-request tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Visible contract tests (starter defects expected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        id: pytest
        continue-on-error: true
        run: python -m pytest -q --junitxml=pytest-report.xml
      - name: Publish counts
        if: always()
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path("pytest-report.xml")
          if not p.exists():
              s="## Test report\n\nNo XML report; inspect setup/test logs.\n"
          else:
              r=ET.parse(p).getroot()
              suites=[r] if r.tag=="testsuite" else list(r.iter("testsuite"))
              n=sum(int(x.attrib.get("tests",0)) for x in suites)
              f=sum(int(x.attrib.get("failures",0)) for x in suites)
              e=sum(int(x.attrib.get("errors",0)) for x in suites)
              sk=sum(int(x.attrib.get("skipped",0)) for x in suites)
              s=f"## Test report\n\n- Total: {n}\n- Passed: {n-f-e-sk}\n- Failed: {f}\n- Errors: {e}\n- Skipped: {sk}\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as o:o.write(s)
          print(s)
          PY
      - name: Fail if any visible test fails
        if: steps.pytest.outcome == 'failure'
        run: exit 1
