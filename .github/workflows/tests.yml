name: Validation tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Startup challenge checks (starter failures are expected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline demo
        run: python -m main
      - name: Run visible tests and save report
        id: pytest
        continue-on-error: true
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/pytest-report.xml"
      - name: Publish exact test counts
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "pytest-report.xml"
          if not report.exists():
              summary = "## Test report\n\nNo XML report was produced. Inspect the test step logs.\n"
          else:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              total = sum(int(s.attrib.get("tests", 0)) for s in suites)
              failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
              errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
              skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
              passed = total - failures - errors - skipped
              summary = (
                  "## Test report\n\n"
                  f"- Total: {total}\n- Passed: {passed}\n- Failed: {failures}\n"
                  f"- Errors: {errors}\n- Skipped: {skipped}\n"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          print(summary)
          PY
      - name: Keep the check red while visible tests fail
        if: steps.pytest.outcome == 'failure'
        run: exit 1
