name: Build student problem statement PDF

on:
  push:
    branches: [main]
    paths:
      - "STUDENT_PROBLEM_STATEMENT.md"
      - "scripts/build_problem_statement_pdf.py"
      - ".github/workflows/build-student-pdf.yml"

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF builder
        run: python -m pip install reportlab
      - name: Render PDF from Markdown source
        run: python scripts/build_problem_statement_pdf.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Problem_Statement.pdf
          if git diff --cached --quiet; then
            echo "PDF is already up to date."
            exit 0
          fi
          git commit -m "Build student problem statement PDF"
          git push
